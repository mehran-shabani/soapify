name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure zip is available
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Compute artifact & image names (lowercase)
        id: names
        shell: bash
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "IMAGE=${IMAGE_REPO}:${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Build distribution archive
        run: |
          zip -r app-dist.zip . \
            -x 'media/*' '*/media/*' \
               'db.sqlite3' '*/db.sqlite3' \
               '__pycache__/*' '*/__pycache__/*' \
               '.git/*' '.github/workflows/*' \
               'app-dist.zip'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app-dist.zip
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          generate_release_notes: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Auto Tag

on:
  push:
    branches:
      - main
      - master
      - develop
      - "*"         # در صورت تمایل فقط main را نگه دارید

permissions:
  contents: write   # لازم برای ایجاد و push تگ

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # لازم برای مشاهده همه تگ‌ها

      - name: Compute next tag (bump by 0.01)
        id: vers
        shell: bash
        run: |
          # دریافت آخرین تگ‌های با پیشوند v
          git fetch --tags --force
          LATEST="$(git tag -l 'v*' | sort -V | tail -n1)"

          if [[ -z "$LATEST" ]]; then
            # شروع از v1.00 (معادل 1.0.0)
            NEXT="v1.00"
          else
            # نرمال‌سازی: اگر فرم قدیمی مثل v1.0.0 بود، فقط major.minor را لحاظ کن
            RAW="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW"
            MAJOR="${MAJOR:-1}"
            MINOR="${MINOR:-0}"

            # افزایش یک‌صدمی (minor دو رقمی: 00..99)
            MINOR=$((10#$MINOR + 1))
            if [[ $MINOR -ge 100 ]]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
            fi

            NEXT="v$(printf "%d.%02d" "$MAJOR" "$MINOR")"
          fi

          echo "latest_tag=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "next_tag=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag (if not exists)
        if: steps.vers.outputs.next_tag != steps.vers.outputs.latest_tag
        env:
          NEXT_TAG: ${{ steps.vers.outputs.next_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # اگر تگ همین الآن وجود نداشت، ایجاد و push کن
          if ! git rev-parse -q --verify "refs/tags/${NEXT_TAG}" >/dev/null; then
            git tag -a "${NEXT_TAG}" -m "Auto tag ${NEXT_TAG}"
            git push origin "${NEXT_TAG}"
            echo "Pushed ${NEXT_TAG}"
          else
            echo "Tag ${NEXT_TAG} already exists. Skipping."
          fi
